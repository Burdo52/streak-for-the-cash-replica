<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streak for the Cash</title>
  <style>
  :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --accent-color: #38bdf8;
    --accent-hover: #0284c7;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border-color: #334155;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }

  .app-container {
    max-width: 800px;
    width: 100%;
  }

  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 24px;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Navigation Bar */
  .app-nav {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
    background: #1e293b;
    padding: 6px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
  }

  .nav-btn {
    flex: 1;
    padding: 10px 16px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 8px;
    font-weight: 600;
    transition: all 0.2s ease;
  }

  .nav-btn.active {
    background: var(--accent-color);
    color: #0f172a;
  }

  .nav-btn:hover:not(.active) {
    color: var(--text-primary);
  }

  /* Matchup Cards Grid */
  #matchups-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .matchup-card {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .matchup-card:hover {
    border-color: #475569;
    transform: translateY(-2px);
  }

  .sport-badge {
    display: inline-block;
    padding: 4px 10px;
    background-color: rgba(56, 189, 248, 0.1);
    color: var(--accent-color);
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .matchup-card h3 {
    margin: 0 0 16px 0;
    font-size: 1.15rem;
    line-height: 1.4;
  }

  /* Selection Buttons */
  .options {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }

  .pick-btn {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--border-color);
    background-color: #0f172a;
    color: var(--text-primary);
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .pick-btn:hover:not(:disabled) {
    border-color: var(--accent-color);
    background-color: rgba(56, 189, 248, 0.1);
    color: var(--accent-color);
  }

  .matchup-card.locked {
    opacity: 0.55;
  }

  .pick-btn:disabled {
    cursor: not-allowed;
    border-color: #334155;
    color: #64748b;
  }

  .status-label {
    margin: 0;
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  /* Tables for Leaderboard & Profile */
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border-color);
  }

  th, td {
    padding: 14px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
  }

  th {
    background-color: #0f172a;
    color: var(--text-secondary);
    font-size: 0.85rem;
    text-transform: uppercase;
  }

  tr:last-child td {
    border-bottom: none;
  }

  /* Status Badges */
  .badge {
    padding: 4px 8px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.8rem;
  }
  .badge.win { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; }
  .badge.loss { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }
  .badge.pending { background-color: rgba(234, 179, 8, 0.2); color: #facc15; }
</style>
</head>
<body>

  <h1>Streak for the Cash</h1>

  <!-- Navigation Bar -->
  <nav class="app-nav">
    <button class="nav-btn active" onclick="showTab('matchups')">Matchups</button>
    <button class="nav-btn" onclick="showTab('leaderboard')">Leaderboard</button>
    <button class="nav-btn" onclick="showTab('profile')">My Profile</button>
  </nav>

  <!-- View 1: Matchups (Contains your existing matchup container) -->
  <div id="matchups-section" class="tab-content">
    <div id="matchups-container"></div>
  </div>

  <!-- View 2: Leaderboard -->
  <div id="leaderboard-section" class="tab-content" style="display: none;">
    <h2>🔥 Streak Leaderboard</h2>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>User</th>
          <th>Current Streak</th>
          <th>Longest Streak</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </div>

  <!-- View 3: Profile & Pick History -->
  <div id="profile-section" class="tab-content" style="display: none;">
    <h2>User Profile</h2>
    <p>Track your past picks and active streak.</p>
    <table>
      <thead>
        <tr>
          <th>Sport</th>
          <th>Matchup</th>
          <th>Your Pick</th>
          <th>Outcome</th>
        </tr>
      </thead>
      <tbody id="history-list"></tbody>
    </table>
  </div>

  <script>
    // Tab switching handler
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      if (tabName === 'matchups') {
        document.getElementById('matchups-section').style.display = 'block';
        fetchMatchups();
      } else if (tabName === 'leaderboard') {
        document.getElementById('leaderboard-section').style.display = 'block';
        loadLeaderboard();
      } else if (tabName === 'profile') {
        document.getElementById('profile-section').style.display = 'block';
        fetchPickHistory();
      }
    }

    // Existing Matchups Fetch
    async function fetchMatchups() {
  try {
    const response = await fetch('/api/matchups');
    const matchups = await response.json();
    
    const container = document.getElementById('matchups-container'); 
    if (!container) return;

    container.innerHTML = '';
    const now = new Date();

    matchups.forEach(m => {
      const startTime = new Date(m.start_time);
      const isLocked = now >= startTime || m.status !== 'scheduled';

      // Format date (e.g., "Sep 10") and time (e.g., "7:00 PM")
      const dateFormatted = startTime.toLocaleDateString([], { month: 'short', day: 'numeric' });
      const timeFormatted = startTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const card = document.createElement('div');
      card.className = `matchup-card ${isLocked ? 'locked' : ''}`;
      card.innerHTML = `
        <span class="sport-badge">${m.sport || 'Sports'}</span>
        <h3>${m.prop_text}</h3>
        <div class="options">
          <button 
            class="pick-btn" 
            ${isLocked ? 'disabled' : ''} 
            onclick="makePick(${m.matchup_id}, '${m.option_a}')">
            ${m.option_a}
          </button>
          <button 
            class="pick-btn" 
            ${isLocked ? 'disabled' : ''} 
            onclick="makePick(${m.matchup_id}, '${m.option_b}')">
            ${m.option_b}
          </button>
        </div>
        <p class="status-label">
          ${isLocked ? '🔒 Locked' : `Starts: ${dateFormatted} at ${timeFormatted}`}
        </p>
      `;
      container.appendChild(card);
    });
  } catch (err) {
    console.error('Error fetching matchups:', err);
  }
}

    // Leaderboard Fetch
    async function loadLeaderboard() {
      try {
        const response = await fetch('/api/leaderboard');
        const leaderboard = await response.json();
        const tbody = document.getElementById('leaderboard-body');
        if (!tbody) return;

        tbody.innerHTML = '';
        leaderboard.forEach((user, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>#${index + 1}</strong></td>
            <td>${user.username}</td>
            <td><span class="badge win">🔥 ${user.current_streak}</span></td>
            <td>🏆 ${user.longest_streak}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error('Failed to load leaderboard:', err);
      }
    }

    // Pick History Fetch
    async function fetchPickHistory() {
      const token = localStorage.getItem('token');
      if (!token) return;

      try {
        const response = await fetch('/api/users/picks', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (!response.ok) throw new Error('Failed to fetch history');
        
        const history = await response.json();
        const listContainer = document.getElementById('history-list');
        if (!listContainer) return;

        listContainer.innerHTML = '';
        history.forEach(item => {
          const row = document.createElement('tr');
          let statusBadge = '<span class="badge pending">⏳ Pending</span>';
          if (item.status === 'Win') statusBadge = '<span class="badge win">✅ Win</span>';
          else if (item.status === 'Loss') statusBadge = '<span class="badge loss">❌ Loss</span>';

          row.innerHTML = `
            <td>${item.sport}</td>
            <td>${item.propText}</td>
            <td><strong>${item.selectedOption}</strong></td>
            <td>${statusBadge}</td>
          `;
          listContainer.appendChild(row);
        });
      } catch (err) {
        console.error('Error rendering pick history:', err);
      }
    }

    // Initial page load
    document.addEventListener('DOMContentLoaded', () => {
      fetchMatchups();
    });
  </script>
</body>
</html>
