<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streak for the Cash</title>
  <style>
  :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --accent-color: #38bdf8;
    --accent-hover: #0284c7;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border-color: #334155;
  }

  body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-primary);
  margin: 0;
  padding: 20px;
  /* Remove flex from body to prevent horizontal side-by-side alignment */
  display: block; 
}

.app-container {
  max-width: 800px;
  margin: 0 auto; /* Centers the app container horizontally */
  width: 100%;
  display: flex;
  flex-direction: column; /* Force elements inside container to stack top-to-bottom */
}

.tab-content {
  width: 100%;
  clear: both;
}

  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 24px;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Navigation Bar */
  .app-nav {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
    background: #1e293b;
    padding: 6px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
  }

  .nav-btn {
    flex: 1;
    padding: 10px 16px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 8px;
    font-weight: 600;
    transition: all 0.2s ease;
  }

  .nav-btn.active {
    background: var(--accent-color);
    color: #0f172a;
  }

  .nav-btn:hover:not(.active) {
    color: var(--text-primary);
  }

  /* Matchup Cards Grid */
  #matchups-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .matchup-card {
  background-color: #334155; /* Lighter slate gray for high contrast against #0f172a body */
  border: 1px solid #475569; /* Brighter border */
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.matchup-card:hover {
  border-color: #38bdf8;
  transform: translateY(-2px);
}

  /* Base Sport Badge Styling */
.sport-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 12px;
  color: #ffffff;
  background-color: #64748b; /* Slate fallback for generic sports */
}

/* Specific League Accent Colors */
.sport-badge.mlb { 
  background-color: #0284c7; /* MLB Blue */
}

.sport-badge.epl { 
  background-color: #38003c; /* Premier League Dark Purple */
  border: 1px solid #00ff87;  /* Neon Mint Border Accent */
  color: #00ff87;
}

.sport-badge.nfl { 
  background-color: #b91c1c; /* Shield Red */
}

.sport-badge.ncaaf { 
  background-color: #d97706; /* College Gold / Football Leather */
}

  .matchup-card h3 {
  margin: 0 0 16px 0;
  font-size: 1.2rem;
  line-height: 1.4;
  color: #ffffff; /* Crisp white for maximum legibility */
}

  /* Selection Buttons */
  .options {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }

  .pick-btn {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid #64748b;
  background-color: #1e293b; /* Darker interior button to pop inside the brighter card */
  color: #f8fafc;
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

  .pick-btn:hover:not(:disabled) {
  border-color: #38bdf8;
  background-color: #38bdf8;
  color: #0f172a; /* Dark text on bright blue fill on hover */
}

  .matchup-card.locked {
  opacity: 0.65;
  background-color: #1e293b;
}

  .pick-btn:disabled {
    cursor: not-allowed;
    border-color: #334155;
    color: #64748b;
  }

  .status-label {
  margin-top: 12px;
  font-size: 0.9rem;
  font-weight: 600;
  color: #cbd5e1; /* Brighter slate for high readability */
}

  /* Tables for Leaderboard & Profile */
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border-color);
  }

  th, td {
    padding: 14px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
  }

  th {
    background-color: #0f172a;
    color: var(--text-secondary);
    font-size: 0.85rem;
    text-transform: uppercase;
  }

  tr:last-child td {
    border-bottom: none;
  }

  /* Status Badges */
  .badge {
    padding: 4px 8px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.8rem;
  }
  .badge.win { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; }
  .badge.loss { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }
  .badge.pending { background-color: rgba(234, 179, 8, 0.2); color: #facc15; }

  .date-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.date-btn {
  padding: 8px 14px;
  border: 1px solid #475569;
  background-color: #1e293b;
  color: #94a3b8;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s ease;
}

.date-btn:hover {
  border-color: #38bdf8;
  color: #ffffff;
}

.date-btn.active {
  background-color: #38bdf8;
  color: #0f172a;
  border-color: #38bdf8;
}

/* Highlighted state for user's selected option */
.pick-btn.selected {
  background-color: #38bdf8;
  color: #0f172a;
  border-color: #38bdf8;
  font-weight: 800;
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
}

/* Maintain active look even if game is locked */
.pick-btn.selected:disabled {
  background-color: #0284c7;
  color: #ffffff;
  border-color: #38bdf8;
  opacity: 1; /* Override opacity so user can see what they picked */
}

/* Custom Sport Badge Colors */
.sport-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 12px;
  color: #ffffff;
}

/* Specific League Colors */
.sport-badge.mlb { background-color: #0284c7; }   /* Blue */
.sport-badge.epl { background-color: #38003c; border: 1px solid #00ff87; } /* Premier League Purple */
.sport-badge.nfl { background-color: #b91c1c; }   /* NFL Red */
.sport-badge.ncaaf { background-color: #d97706; } /* College Gold/Orange */

/* Filter Bar Styling */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  overflow-x: auto;
  padding-bottom: 6px;
  -webkit-overflow-scrolling: touch;
}

.filter-btn {
  background-color: #1e293b;
  color: #94a3b8;
  border: 1px solid #334155;
  border-radius: 20px;
  padding: 6px 16px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s ease;
}

.filter-btn:hover {
  background-color: #334155;
  color: #f8fafc;
}

.filter-btn.active {
  background-color: #38bdf8;
  color: #0f172a;
  border-color: #38bdf8;
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
}
</style>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
  <h1>Streak for the Cash</h1>
  <div id="auth-nav">
    <button id="login-nav-btn" class="auth-btn" onclick="openAuthModal()">Login / Register</button>
    <div id="user-info" style="display: none;">
      <span id="username-display"></span>
      <button class="auth-btn logout" onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<!-- Auth Modal -->
<div id="auth-modal" class="modal" style="display: none;">
  <div class="modal-content">
    <span class="close-btn" onclick="closeAuthModal()">&times;</span>
    <h2 id="modal-title">Login</h2>
    <form id="auth-form" onsubmit="handleAuth(event)">
      <input type="text" id="auth-username" placeholder="Username" required />
      <input type="password" id="auth-password" placeholder="Password" required />
      <button type="submit" id="auth-submit-btn">Login</button>
    </form>
    <p class="toggle-auth">
      <span id="auth-toggle-text">Need an account?</span> 
      <a href="#" onclick="toggleAuthMode(event)" id="auth-toggle-link">Register</a>
    </p>
  </div>
</div>

    <!-- Navigation Bar -->
    <nav class="app-nav">
      <button class="nav-btn active" onclick="showTab('matchups')">Matchups</button>
      <button class="nav-btn" onclick="showTab('leaderboard')">Leaderboard</button>
      <button class="nav-btn" onclick="showTab('profile')">My Profile</button>
    </nav>

    <!-- View 1: Matchups -->
    <div id="matchups-section" class="tab-content">
      <!-- Inside View 1: Matchups Section -->
<div id="matchups-section" class="tab-content">
  <!-- Date Navigation Bar -->
  <div class="date-bar" id="date-bar"></div>

  <!-- League Filter Bar -->
<div class="filter-bar" id="filter-bar">
  <button class="filter-btn active" onclick="setSportFilter('ALL')">All</button>
  <button class="filter-btn" onclick="setSportFilter('MLB')">MLB</button>
  <button class="filter-btn" onclick="setSportFilter('EPL')">EPL</button>
  <button class="filter-btn" onclick="setSportFilter('NFL')">NFL</button>
  <button class="filter-btn" onclick="setSportFilter('NCAAF')">NCAAF</button>
</div>

<!-- Matchups Container -->
<div id="matchups-container"></div>
     
    <!-- View 2: Leaderboard -->
    <div id="leaderboard-section" class="tab-content" style="display: none;">
      <h2>🔥 Streak Leaderboard</h2>
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>User</th>
            <th>Current Streak</th>
            <th>Longest Streak</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>

    <!-- View 3: Profile & Pick History -->
    <div id="profile-section" class="tab-content" style="display: none;">
      <h2>User Profile</h2>
      <p>Track your past picks and active streak.</p>
      <table>
        <thead>
          <tr>
            <th>Sport</th>
            <th>Matchup</th>
            <th>Your Pick</th>
            <th>Outcome</th>
          </tr>
        </thead>
        <tbody id="history-list"></tbody>
      </table>
    </div>
  </div>

  <script>
let isLoginMode = true;

function checkAuthState() {
  const token = localStorage.getItem('token');
  const username = localStorage.getItem('username');

  if (token && username) {
    document.getElementById('login-nav-btn').style.display = 'none';
    document.getElementById('user-info').style.display = 'flex';
    document.getElementById('username-display').textContent = `👤 ${username}`;
  } else {
    document.getElementById('login-nav-btn').style.display = 'block';
    document.getElementById('user-info').style.display = 'none';
  }
}

function openAuthModal() {
  document.getElementById('auth-modal').style.display = 'flex';
}

function closeAuthModal() {
  document.getElementById('auth-modal').style.display = 'none';
}

function toggleAuthMode(e) {
  e.preventDefault();
  isLoginMode = !isLoginMode;
  document.getElementById('modal-title').textContent = isLoginMode ? 'Login' : 'Register';
  document.getElementById('auth-submit-btn').textContent = isLoginMode ? 'Login' : 'Register';
  document.getElementById('auth-toggle-text').textContent = isLoginMode ? "Need an account?" : "Already have an account?";
  document.getElementById('auth-toggle-link').textContent = isLoginMode ? 'Register' : 'Login';
}

async function handleAuth(e) {
  e.preventDefault();
  const username = document.getElementById('auth-username').value;
  const password = document.getElementById('auth-password').value;
  const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';

  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || 'Auth failed');

    localStorage.setItem('token', data.token);
    localStorage.setItem('username', data.user.username);

    closeAuthModal();
    checkAuthState();
    fetchMatchups(); // Refresh matchups to display current user's picks
  } catch (err) {
    alert(err.message);
  }
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('username');
  checkAuthState();
  fetchMatchups();
}

async function makePick(matchupId, selectedOption) {
  const token = localStorage.getItem('token');
  if (!token) {
    openAuthModal();
    return;
  }

  try {
    const res = await fetch('/api/picks', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ matchupId, selectedOption })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to save pick');

    fetchMatchups(); // Re-render picks with checkmarks
  } catch (err) {
    alert(err.message);
  }
}

// Initial load check
document.addEventListener('DOMContentLoaded', () => {
  checkAuthState();
});

    // Tab switching handler
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      if (tabName === 'matchups') {
        document.getElementById('matchups-section').style.display = 'block';
        fetchMatchups();
      } else if (tabName === 'leaderboard') {
        document.getElementById('leaderboard-section').style.display = 'block';
        loadLeaderboard();
      } else if (tabName === 'profile') {
        document.getElementById('profile-section').style.display = 'block';
        fetchPickHistory();
      }
    }

    let selectedSport = 'ALL'; // Global state for active league filter

function setSportFilter(sport) {
  selectedSport = sport;

  // Update active state on buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.trim().toUpperCase() === sport);
  });

  // Re-render matchups for current date using new filter
  fetchMatchups(selectedDate);
}

async function fetchMatchups(dateStr = selectedDate) {
  try {
    const token = localStorage.getItem('token');
    const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

    const response = await fetch(`/api/matchups?date=${dateStr}`, { headers });
    const matchups = await response.json();
    
    const container = document.getElementById('matchups-container'); 
    if (!container) return;

    container.innerHTML = '';

    if (!Array.isArray(matchups)) {
      console.error('Server returned non-array payload:', matchups);
      container.innerHTML = `<p style="text-align: center; color: #f87171;">Failed to load matchups: ${matchups.error || 'Server error'}</p>`;
      return;
    }

    // Client-side sport filter check
    const filteredMatchups = matchups.filter(m => {
      if (selectedSport === 'ALL') return true;
      return (m.sport || '').toUpperCase() === selectedSport;
    });

    if (filteredMatchups.length === 0) {
      container.innerHTML = `<p style="text-align: center; color: #94a3b8;">No ${selectedSport === 'ALL' ? '' : selectedSport} matchups available for this date.</p>`;
      return;
    }

    const now = new Date();

    filteredMatchups.forEach(m => {
      const startTime = new Date(m.start_time);
      const isLocked = now >= startTime || m.status !== 'scheduled';
      const timeFormatted = startTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const sportClass = (m.sport || '').toLowerCase().trim();

      const isOptionASelected = m.user_pick === m.option_a;
      const isOptionBSelected = m.user_pick === m.option_b;

      const card = document.createElement('div');
      card.className = `matchup-card ${isLocked ? 'locked' : ''}`;
      card.innerHTML = `
        <span class="sport-badge ${sportClass}">${m.sport || 'Sports'}</span>
        <h3>${m.prop_text}</h3>
        <div class="options">
          <button 
            class="pick-btn ${isOptionASelected ? 'selected' : ''}" 
            ${isLocked ? 'disabled' : ''} 
            onclick="makePick(${m.matchup_id}, '${m.option_a}')">
            ${m.option_a} ${isOptionASelected ? '✓' : ''}
          </button>
          <button 
            class="pick-btn ${isOptionBSelected ? 'selected' : ''}" 
            ${isLocked ? 'disabled' : ''} 
            onclick="makePick(${m.matchup_id}, '${m.option_b}')">
            ${m.option_b} ${isOptionBSelected ? '✓' : ''}
          </button>
        </div>
        <p class="status-label">
          ${isLocked ? '🔒 Locked' : `Starts: ${timeFormatted}`}
        </p>
      `;
      container.appendChild(card);
    });
  } catch (err) {
    console.error('Error fetching matchups:', err);
  }
}

    // Leaderboard Fetch
    async function loadLeaderboard() {
      try {
        const response = await fetch('/api/leaderboard');
        const leaderboard = await response.json();
        const tbody = document.getElementById('leaderboard-body');
        if (!tbody) return;

        tbody.innerHTML = '';
        leaderboard.forEach((user, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>#${index + 1}</strong></td>
            <td>${user.username}</td>
            <td><span class="badge win">🔥 ${user.current_streak}</span></td>
            <td>🏆 ${user.longest_streak}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error('Failed to load leaderboard:', err);
      }
    }

    // Pick History Fetch
    async function fetchPickHistory() {
      const token = localStorage.getItem('token');
      if (!token) return;

      try {
        const response = await fetch('/api/users/picks', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (!response.ok) throw new Error('Failed to fetch history');
        
        const history = await response.json();
        const listContainer = document.getElementById('history-list');
        if (!listContainer) return;

        listContainer.innerHTML = '';
        history.forEach(item => {
          const row = document.createElement('tr');
          let statusBadge = '<span class="badge pending">⏳ Pending</span>';
          if (item.status === 'Win') statusBadge = '<span class="badge win">✅ Win</span>';
          else if (item.status === 'Loss') statusBadge = '<span class="badge loss">❌ Loss</span>';

          row.innerHTML = `
            <td>${item.sport}</td>
            <td>${item.propText}</td>
            <td><strong>${item.selectedOption}</strong></td>
            <td>${statusBadge}</td>
          `;
          listContainer.appendChild(row);
        });
      } catch (err) {
        console.error('Error rendering pick history:', err);
      }
    }

    // Helper to format a Date object as YYYY-MM-DD using LOCAL time (not UTC)
function getLocalDateString(dateObj = new Date()) {
  const year = dateObj.getFullYear();
  const month = String(dateObj.getMonth() + 1).padStart(2, '0');
  const day = String(dateObj.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

// Initialize selectedDate with local day string
let selectedDate = getLocalDateString();

// Render dynamic day buttons (Today + next 4 days)
function renderDateBar() {
  const dateBar = document.getElementById('date-bar');
  if (!dateBar) return;
  
  dateBar.innerHTML = '';
  const today = new Date();

  // Loop from -1 (Yesterday) up to +3 (3 days ahead)
  for (let i = -1; i <= 3; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    
    // Use local time formatting
    const dateStr = getLocalDateString(d);

    let label = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    if (i === -1) label = 'Yesterday';
    if (i === 0) label = 'Today';
    if (i === 1) label = 'Tomorrow';

    const btn = document.createElement('button');
    btn.className = `date-btn ${dateStr === selectedDate ? 'active' : ''}`;
    btn.textContent = label;
    btn.onclick = () => {
      selectedDate = dateStr;
      renderDateBar();
      fetchMatchups(selectedDate);
    };
    dateBar.appendChild(btn);
  }
}

async function makePick(matchupId, selectedOption) {
  const token = localStorage.getItem('token');
  if (!token) {
    alert('Please log in to make a pick.');
    return;
  }

  try {
    const response = await fetch('/api/picks', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ matchup_id: matchupId, selected_option: selectedOption })
    });

    if (response.ok) {
      // Re-fetch matchups to trigger the highlighted selected state
      fetchMatchups(selectedDate); 
    } else {
      const err = await response.json();
      alert(err.error || 'Failed to submit pick.');
    }
  } catch (err) {
    console.error('Error making pick:', err);
  }
}
    // Initial page load
    document.addEventListener('DOMContentLoaded', () => {
      renderDateBar();
      fetchMatchups();
    });
  </script>
</body>
</html>
